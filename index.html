<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gallery</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <header>
        <h1>Nature Gallery</h1>
        <p>Click any thumbnail to view a larger image.</p>
    </header>

    <section class="gallery-container">

        <div class="full-img">
            <img
                class="displayed-img"
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500&auto=format&fit=crop"
                alt="Nature photograph"
            >

            <div class="overlay"></div>

            <button class="dark">Dark Mode</button>
        </div>

        <div class="thumb-bar"></div>

    </section>

</body>
</html>
